version: '3.8'

services:
tailscale:
    image: tailscale/tailscale:latest
    container_name: tailscale-bridge
    hostname: npm-vps-bridge
    environment:
      - TS_AUTHKEY= <YourHeadscalePre-AuthKey># Generate a REUSABLE key in Headplane
      - TS_EXTRA_ARGS=--login-server <YourHeadscaleDomain>
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--login-server=http://127.0.0.1:8080 --reset
    volumes:
      - ./tailscale/state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    network_mode: "host" 
    restart: unless-stopped

  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: npm-app-1
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      # These "collections" tell CrowdSec what to look for (Nginx attacks, etc.)
      - COLLECTIONS=crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios
      - LAPI_LISTEN_ADDR=127.0.0.1:8081
      - DOWNLOAD_GEOLITE_ASN=true
      - DOWNLOAD_GEOLITE_CITY=true
    user: root
    volumes:
      - ./crowdsec/config:/etc/crowdsec
      - crowdsec-db:/var/lib/crowdsec
      # IMPORTANT: Point this to where your NPM logs live
      - ./data/logs:/var/log/nginx:ro
    network_mode: "host" # Keeps it on the same network as your NPM/Headscale setup

volumes:
  crowdsec-db:

